<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment Checkout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .checkout-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }

        h2 {
            color: #333333;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .subtitle {
            color: #666666;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .order-summary {
            background-color: #f8fafc;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e2e8f0;
        }

        .order-summary span {
            font-weight: 600;
            color: #334155;
        }

        .order-summary .price {
            color: #2563eb;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #475569;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            color: #334155;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #2563eb;
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .pay-btn {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .pay-btn:hover {
            background-color: #1d4ed8;
        }

        .secure-text {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

<div class="checkout-container">
    <h2>Pay with card</h2>
    <p class="subtitle">Enter your payment information below.</p>

    <!-- Simple Order Summary -->
    <div class="order-summary">
        <span>Total Due:</span>
        <span class="price">$49.99</span>
    </div>

    <!-- Payment Form -->
    <form action="/process-payment" method="POST">
        <div class="form-group">
            <label for="card-name">Name on card</label>
            <input type="text" id="card-name" name="cardname" placeholder="John Doe" required>
        </div>

        <div class="form-group">
            <label for="card-number">Card number</label>
            <input type="text" id="card-number" name="cardnumber" placeholder="1234 5678 9101 1121" inputmode="numeric" maxlength="19" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="expiry">Expiration date</label>
                <input type="text" id="expiry" name="expiry" placeholder="MM/YY" maxlength="5" required>
            </div>
            <div class="form-group">
                <label for="cvc">CVC</label>
                <input type="text" id="cvc" name="cvc" placeholder="123" maxlength="4" required>
            </div>
        </div>

        <button type="submit" class="pay-btn">Pay $49.99</button>
    </form>

    <div class="secure-text">
        🔒 Secure, encrypted transaction
    </div>
</div>

</body>
</html>
